; MiniCore robot — ESP32 (classic) + Arduino
; Match Wi-Fi channel with the ESP32-S3 dongle (default 6).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I ../common
    -DMINICORE_ROBOT_NAME=\"MiniBot1\"
    -DMINICORE_WIFI_CHANNEL=6
    -DLEFT_MOTOR_PIN=16
    -DRIGHT_MOTOR_PIN=17
