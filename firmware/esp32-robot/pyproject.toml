[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["ssd1306.py"]

[tool.ruff.lint]
# Ignore unused imports from MicroPython builtins
ignore = [
  "F401",  # Unused imports (some are needed for MicroPython)
  "E402",  # Module level import not at top (valid in boot sequences)
]

select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort (imports)
  "C901", # McCabe complexity
]

[tool.ruff.lint.per-file-ignores]
"boot.py" = ["F401", "E402"]

[project]
name="minibot"
version="3.9"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "micropython-esp32-stubs>=1.20",
  "pyright>=1.1.414",
  "ruff>=0.6.0",
]

[tool.pyright]
include = ["."]
exclude = [".*", "__*", "ssd1306.py"]

typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# Point stubPath at the venv's site-packages so the loose micropython-stubs
# .pyi files (time.pyi, machine.pyi, etc.) win over pyright's bundled
# typeshed stdlib stubs, which otherwise always take priority.
#
# The version is baked into this path and there is no version-agnostic spelling
# of it, so the venv must be 3.12 exactly: `uv venv --python 3.12`. Build it on
# anything newer and pyright looks in a directory that does not exist, finds no
# MicroPython stubs, and reports the whole API as missing -- "ticks_ms is not a
# known attribute of module time" and 14 more, which read like real bugs rather
# than a bad path. CI pins 3.12 via setup-python, so this only bites locally.
stubPath = ".venv/lib/python3.12/site-packages"
pythonPlatform = "Linux"

reportMissingModuleSource = "none"
reportUnnecessaryTypeIgnoreComment = "information"
